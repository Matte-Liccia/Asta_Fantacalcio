<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <title>Asta Live - Fantacalcio</title>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/xlsx-js-style@1.2.0/dist/xlsx.min.js"></script>

    <link rel="icon" href="img/hammer.png" type="image/png">
    
    <style>
        body { background-color: #f3f4f6; color: #1f2937; }
        .role-P { background: #fef08a; color: #854d0e; }
        .role-D { background: #bbf7d0; color: #166534; }
        .role-C { background: #bfdbfe; color: #1e40af; }
        .role-A { background: #fecaca; color: #991b1b; }
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #f1f1f1; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
        
        /* Animazione per i toast */
        @keyframes slideIn {
            from { transform: translateX(100%); opacity: 0; }
            to { transform: translateX(0); opacity: 1; }
        }
        .toast-enter { animation: slideIn 0.3s ease-out forwards; }
    </style>
</head>
<body>
    <div id="root"></div>
    
    <script type="text/babel">
        const INITIAL_TEAMS = [].map(name => ({
            id: typeof crypto !== 'undefined' && crypto.randomUUID ? crypto.randomUUID() : String(Math.random()),
            name,
            players: [],
            spent: 0
        }));

        const MAX_SLOTS = { P: 3, D: 8, C: 8, A: 6 };
        const BUDGET = 500;

        function App() {
            const [teams, setTeams] = React.useState(() => {
                try {
                    const saved = localStorage.getItem('coachBeard_teams');
                    return saved ? JSON.parse(saved) : INITIAL_TEAMS;
                } catch (e) {
                    return INITIAL_TEAMS;
                }
            });

            const [purchases, setPurchases] = React.useState(() => {
                try {
                    const saved = localStorage.getItem('coachBeard_purchases');
                    return saved ? JSON.parse(saved) : [];
                } catch (e) {
                    return [];
                }
            });
            
            const [playersList, setPlayersList] = React.useState([]);
            const [isLoadingList, setIsLoadingList] = React.useState(true);
            
            const [search, setSearch] = React.useState('');
            const [selectedPlayer, setSelectedPlayer] = React.useState(null);
            const [bidPrice, setBidPrice] = React.useState('');
            const [bidTeam, setBidTeam] = React.useState(0);
            
            // Nuovi stati per UI avanzata
            const [toast, setToast] = React.useState(null);
            const [viewingTeam, setViewingTeam] = React.useState(null);

            const bidInputRef = React.useRef(null);

            // Funzione per i Toast Notification
            const showToast = (message, type = 'error') => {
                setToast({ message, type });
                setTimeout(() => setToast(null), 4000);
            };

            // Caricamento automatico
            React.useEffect(() => {
                const fetchExcelData = async () => {
                    try {
                        const response = await fetch('./tabella/Quotazioni_Fantacalcio_Stagione_2026_27.xlsx');
                        if (!response.ok) throw new Error("File non trovato sul server");

                        const arrayBuffer = await response.arrayBuffer();
                        const workbook = XLSX.read(arrayBuffer, { type: 'array' });
                        const firstSheetName = workbook.SheetNames[0];
                        const worksheet = workbook.Sheets[firstSheetName];
                        
                        const jsonData = XLSX.utils.sheet_to_json(worksheet, { range: 1 });
                        const mappedPlayers = jsonData.map(row => ({
                            id: row['Id'],
                            ruolo: row['R'],
                            nome: row['Nome'],
                            squadra: row['Squadra'],
                            qi: row['Qt.I'],
                            qa: row['Qt.A'],
                            fvm: row['FVM']
                        }));
                        
                        setPlayersList(mappedPlayers);
                    } catch (error) {
                        console.warn("Caricamento automatico fallito, in attesa di upload manuale.");
                    } finally {
                        setIsLoadingList(false);
                    }
                };

                fetchExcelData();
            }, []);

            // Caricamento manuale file
            const handleFileUpload = (e) => {
                const file = e.target.files[0];
                if (!file) return;

                const reader = new FileReader();
                reader.onload = (evt) => {
                    try {
                        const arrayBuffer = evt.target.result;
                        const workbook = XLSX.read(arrayBuffer, { type: 'array' });
                        const firstSheetName = workbook.SheetNames[0];
                        const worksheet = workbook.Sheets[firstSheetName];
                        
                        const jsonData = XLSX.utils.sheet_to_json(worksheet, { range: 1 });
                        const mappedPlayers = jsonData.map(row => ({
                            id: row['Id'],
                            ruolo: row['R'],
                            nome: row['Nome'],
                            squadra: row['Squadra'],
                            qi: row['Qt.I'],
                            qa: row['Qt.A'],
                            fvm: row['FVM']
                        }));
                        
                        setPlayersList(mappedPlayers);
                        showToast("Listone caricato con successo!", "success");
                    } catch (error) {
                        console.error("Errore nella lettura del file:", error);
                        showToast("Errore nella lettura del file Excel.");
                    }
                };
                reader.readAsArrayBuffer(file);
            };

            // Salvataggio automatico
            React.useEffect(() => {
                try {
                    localStorage.setItem('coachBeard_teams', JSON.stringify(teams));
                    localStorage.setItem('coachBeard_purchases', JSON.stringify(purchases));
                } catch (e) {
                    console.error("Errore durante il salvataggio su localStorage:", e);
                }
            }, [teams, purchases]);

            // Auto-focus sul campo prezzo
            React.useEffect(() => {
                if (selectedPlayer && bidInputRef.current) {
                    bidInputRef.current.focus();
                }
            }, [selectedPlayer]);

            // Ricerca memoizzata
            const filteredPlayers = React.useMemo(() => {
                if (search.length < 2) return [];
                const purchasedIds = new Set(purchases.map(p => p.player.id));
                const searchLower = search.toLowerCase().trim();
                return playersList.filter(p => 
                    !purchasedIds.has(p.id) && 
                    (p.nome.toLowerCase().includes(searchLower) || 
                     p.squadra.toLowerCase().includes(searchLower))
                ).slice(0, 8);
            }, [search, playersList, purchases]);

            const getTeamStats = React.useCallback((team) => {
                const roleCounts = { P: 0, D: 0, C: 0, A: 0 };
                team.players.forEach(p => roleCounts[p.ruolo]++);
                const totalPlayers = team.players.length;
                const emptySlots = 25 - totalPlayers;
                const remainingBudget = BUDGET - team.spent;
                const maxBid = remainingBudget - (emptySlots > 0 ? emptySlots - 1 : 0);
                const budgetPercent = ((team.spent / BUDGET) * 100).toFixed(0);
                return { roleCounts, remainingBudget, maxBid, emptySlots, budgetPercent };
            }, []);

            const handlePurchase = () => {
                if (!selectedPlayer) return;
                
                // Validazione rigorosa mantenendo input text
                const priceString = bidPrice.trim();
                const price = Number(priceString);
                
                if (priceString === '' || isNaN(price) || price < 1 || !Number.isInteger(price)) {
                    showToast("Inserisci un'offerta valida (numero intero >= 1).");
                    return;
                }

                const tIdx = parseInt(bidTeam, 10);
                const team = teams[tIdx];
                if (!team) return;

                const stats = getTeamStats(team);
                
                if (price > stats.maxBid) {
                    showToast(`Supera il rilancio massimo consentito (${stats.maxBid} CR) per ${team.name}!`);
                    return;
                }
                if (stats.roleCounts[selectedPlayer.ruolo] >= MAX_SLOTS[selectedPlayer.ruolo]) {
                    showToast(`Slot ${selectedPlayer.ruolo} pieni per ${team.name}!`);
                    return;
                }

                const newPurchase = { player: selectedPlayer, teamIdx: tIdx, teamName: team.name, price, id: Date.now() };
                const newTeams = [...teams];
                newTeams[tIdx].players.push(selectedPlayer);
                newTeams[tIdx].spent += price;

                setTeams(newTeams);
                setPurchases([newPurchase, ...purchases]); // Aggiunto in testa per la cronologia
                showToast(`${selectedPlayer.nome} assegnato a ${team.name} per ${price} CR!`, "success");
                setSelectedPlayer(null);
                setSearch('');
                setBidPrice('');
            };

            const markUnsold = () => {
                setSelectedPlayer(null);
                setSearch('');
                setBidPrice('');
            };

            const undoLast = () => {
                if (purchases.length === 0) return;
                const last = purchases[0]; // Ora è in testa
                const newTeams = [...teams];
                const pIdx = newTeams[last.teamIdx].players.findIndex(p => p.id === last.player.id);
                if (pIdx !== -1) {
                    newTeams[last.teamIdx].players.splice(pIdx, 1);
                    newTeams[last.teamIdx].spent -= last.price;
                    setTeams(newTeams);
                    setPurchases(purchases.slice(1));
                    showToast(`Acquisto di ${last.player.nome} annullato.`, "success");
                }
            };

            const editTeamName = (idx) => {
                const newName = prompt("Modifica il nome della squadra:", teams[idx].name);
                if (newName !== null && newName.trim() !== "") {
                    const newTeams = [...teams];
                    newTeams[idx].name = newName.trim();
                    setTeams(newTeams);
                }
            };

            const addTeam = () => {
                const newName = prompt("Inserisci il nome della nuova squadra:");
                if (newName !== null && newName.trim() !== "") {
                    const newTeamObj = {
                        id: typeof crypto !== 'undefined' && crypto.randomUUID ? crypto.randomUUID() : String(Math.random()),
                        name: newName.trim(),
                        players: [],
                        spent: 0
                    };
                    setTeams([...teams, newTeamObj]);
                }
            };

            const removeTeam = (idx) => {
                if (teams[idx].players.length > 0) {
                    showToast("Impossibile rimuovere: la squadra ha già acquistato giocatori.");
                    return;
                }
                
                if (confirm(`Sei sicuro di voler rimuovere la squadra ${teams[idx].name}?`)) {
                    const newTeams = teams.filter((_, index) => index !== idx);
                    setTeams(newTeams);
                    if (parseInt(bidTeam, 10) === idx) setBidTeam(0); 
                }
            };

            const resetAll = () => {
                if (confirm("ATTENZIONE: Sei sicuro di voler cancellare TUTTA l'asta e ricominciare da zero?")) {
                    setTeams(INITIAL_TEAMS);
                    setPurchases([]);
                    localStorage.removeItem('coachBeard_teams');
                    localStorage.removeItem('coachBeard_purchases');
                    showToast("Asta resettata completamente.", "success");
                }
            };

            const generateExport = () => {
                // Logica di export invariata (funzionante e solida)
                const excelData = [];
                const merges = [];
                const colsWidth = [];

                let maxPlayers = 0;
                teams.forEach(t => {
                    if (t.players.length > maxPlayers) maxPlayers = t.players.length;
                });
                
                const totalRows = maxPlayers + 2;
                for (let i = 0; i < totalRows; i++) {
                    excelData.push([]);
                }

                teams.forEach((team, teamIndex) => {
                    const colOffset = teamIndex * 4;

                    excelData[0][colOffset] = `${team.name}`;
                    merges.push({ s: { r: 0, c: colOffset }, e: { r: 0, c: colOffset + 2 } });

                    excelData[1][colOffset] = "Ruolo";
                    excelData[1][colOffset + 1] = "Nome";
                    excelData[1][colOffset + 2] = "Prezzo";

                    colsWidth[colOffset] = { wch: 8 };
                    colsWidth[colOffset + 1] = { wch: 25 };
                    colsWidth[colOffset + 2] = { wch: 10 };
                    colsWidth[colOffset + 3] = { wch: 3 };

                    const sorted = [...team.players].sort((a, b) => {
                        const order = {'P': 1, 'D': 2, 'C': 3, 'A': 4};
                        if (order[a.ruolo] !== order[b.ruolo]) return order[a.ruolo] - order[b.ruolo];
                        return a.nome.localeCompare(b.nome);
                    });

                    sorted.forEach((p, pIndex) => {
                        const purchase = purchases.find(pur => pur.player.id === p.id && pur.teamIdx === teamIndex);
                        excelData[pIndex + 2][colOffset] = p.ruolo;
                        excelData[pIndex + 2][colOffset + 1] = p.nome;
                        excelData[pIndex + 2][colOffset + 2] = purchase ? purchase.price : 0;
                    });
                });

                const ws = XLSX.utils.aoa_to_sheet(excelData);
                for (const cellAddress in ws) {
                    if (cellAddress[0] === '!') continue;
                    const cellRow = XLSX.utils.decode_cell(cellAddress).r;
                    ws[cellAddress].s = {
                        alignment: { horizontal: "center", vertical: "center" },
                        font: { bold: cellRow <= 1 }
                    };
                }
                ws['!merges'] = merges;
                ws['!cols'] = colsWidth;

                const wb = XLSX.utils.book_new();
                XLSX.utils.book_append_sheet(wb, ws, "Asta Fantacalcio");

                const fileName = `Riepilogo-Asta-${new Date().toISOString().slice(0, 10)}.xlsx`;
                XLSX.writeFile(wb, fileName);
            };

            if (isLoadingList) {
                return (
                    <div className="h-screen bg-slate-900 flex items-center justify-center">
                        <h1 className="text-3xl font-bold text-white">
                            <i className="fa-solid fa-spinner fa-spin mr-3 text-blue-500"></i>
                            Caricamento in corso...
                        </h1>
                    </div>
                );
            }

            if (playersList.length === 0) {
                return (
                    <div className="h-screen bg-slate-900 flex flex-col items-center justify-center text-white p-6">
                        <i className="fa-solid fa-file-excel text-7xl text-green-500 mb-6 shadow-black drop-shadow-lg"></i>
                        <h1 className="text-4xl font-bold mb-4 uppercase tracking-wider">SanPa_Calcio</h1>
                        <p className="text-slate-400 mb-8 text-center text-lg max-w-md">
                            Seleziona il file Excel delle quotazioni per iniziare l'asta.
                        </p>
                        <label className="bg-blue-600 hover:bg-blue-500 px-8 py-4 rounded-xl cursor-pointer font-bold transition shadow-lg flex items-center gap-3 text-lg">
                            <i className="fa-solid fa-upload"></i>
                            Carica File Quotazioni (.xlsx)
                            <input type="file" accept=".xlsx" className="hidden" onChange={handleFileUpload} />
                        </label>
                    </div>
                );
            }
            
            return (
                <div className="h-screen flex flex-col font-sans overflow-hidden">
                    {/* Header */}
                    <header className="bg-slate-900 text-white p-4 flex justify-between items-center shrink-0 shadow-md">
                        <div className="flex items-center gap-3">
                            <i className="fa-solid fa-clipboard-user text-2xl text-blue-400"></i>
                            <h1 className="text-xl font-bold uppercase tracking-wider">Asta Live</h1>
                        </div>
                        <div className="flex gap-4">
                            <button onClick={undoLast} className="px-4 py-2 bg-yellow-600 hover:bg-yellow-700 text-sm font-semibold rounded shadow transition flex items-center">
                                <i className="fa-solid fa-rotate-left mr-2"></i> Annulla Ultimo
                            </button>
                            <button onClick={generateExport} className="px-4 py-2 bg-green-600 hover:bg-green-700 text-sm font-semibold rounded shadow transition flex items-center">
                                <i className="fa-solid fa-file-excel mr-2"></i> Esporta Excel
                            </button>
                            <button onClick={resetAll} className="px-4 py-2 bg-red-600 hover:bg-red-700 text-sm font-semibold rounded shadow transition flex items-center">
                                <i className="fa-solid fa-power-off mr-2"></i> Reset
                            </button>
                        </div>
                    </header>

                    <div className="flex-1 flex overflow-hidden">
                        {/* Sidebar Sinistra (Squadre e Cronologia) */}
                        <div className="w-1/2 flex flex-col bg-slate-50 border-r border-slate-200 overflow-hidden">
                            {/* Sezione Squadre */}
                            <div className="flex-1 overflow-y-auto p-4 space-y-4">
                                <div className="flex justify-between items-center border-b pb-2 mb-4 sticky top-0 bg-slate-50 z-10">
                                    <h2 className="text-lg font-bold text-slate-700 uppercase">Squadre ({teams.length})</h2>
                                    <button onClick={addTeam} className="bg-blue-600 hover:bg-blue-500 text-white px-3 py-1 rounded text-sm font-bold shadow transition">
                                        <i className="fa-solid fa-plus mr-1"></i> Nuova
                                    </button>
                                </div>
                                <div className="grid grid-cols-2 gap-4">
                                {teams.map((team, idx) => {
                                    const stats = getTeamStats(team);
                                    return (
                                        <div key={team.id || idx} className="bg-white p-3 rounded-lg shadow-sm border border-slate-100 flex flex-col gap-2 relative group">
                                            <div className="flex justify-between items-center">
                                                <span className="font-bold text-slate-800 flex items-center gap-2 truncate">
                                                    {team.name}
                                                </span>
                                                <div className="flex gap-2 opacity-0 group-hover:opacity-100 transition-opacity absolute top-3 right-3 bg-white pl-2">
                                                    <button onClick={() => setViewingTeam(team)} className="text-slate-400 hover:text-blue-600" title="Vedi Rosa">
                                                        <i className="fa-solid fa-eye text-xs"></i>
                                                    </button>
                                                    <button onClick={() => editTeamName(idx)} className="text-slate-400 hover:text-yellow-600" title="Rinomina">
                                                        <i className="fa-solid fa-pen text-xs"></i>
                                                    </button>
                                                    <button onClick={() => removeTeam(idx)} className="text-slate-400 hover:text-red-600" title="Elimina">
                                                        <i className="fa-solid fa-trash text-xs"></i>
                                                    </button>
                                                </div>
                                            </div>
                                            
                                            {/* Info Budget */}
                                            <div>
                                                <div className="flex justify-between items-end mb-1">
                                                    <span className="text-2xl font-black text-green-600 leading-none">{stats.remainingBudget} <span className="text-xs text-slate-400 font-normal">CR</span></span>
                                                    <span className="text-xs text-slate-500 font-medium">Rilancio max: <strong className="text-slate-800">{stats.maxBid}</strong></span>
                                                </div>
                                                <div className="w-full bg-slate-100 rounded-full h-1.5 mb-1 overflow-hidden">
                                                    <div className={`h-1.5 rounded-full ${stats.budgetPercent > 90 ? 'bg-red-500' : stats.budgetPercent > 70 ? 'bg-yellow-400' : 'bg-green-500'}`} style={{width: `${stats.budgetPercent}%`}}></div>
                                                </div>
                                                <div className="text-[10px] text-right text-slate-400">Spesi: {team.spent}/{BUDGET}</div>
                                            </div>

                                            <div className="flex gap-1 text-[11px] mt-auto pt-2 border-t border-slate-50">
                                                <div className={`px-1 py-0.5 rounded flex-1 text-center font-bold ${stats.roleCounts.P >= MAX_SLOTS.P ? 'bg-slate-200 text-slate-400 line-through' : 'role-P'}`}>P: {stats.roleCounts.P}/3</div>
                                                <div className={`px-1 py-0.5 rounded flex-1 text-center font-bold ${stats.roleCounts.D >= MAX_SLOTS.D ? 'bg-slate-200 text-slate-400 line-through' : 'role-D'}`}>D: {stats.roleCounts.D}/8</div>
                                                <div className={`px-1 py-0.5 rounded flex-1 text-center font-bold ${stats.roleCounts.C >= MAX_SLOTS.C ? 'bg-slate-200 text-slate-400 line-through' : 'role-C'}`}>C: {stats.roleCounts.C}/8</div>
                                                <div className={`px-1 py-0.5 rounded flex-1 text-center font-bold ${stats.roleCounts.A >= MAX_SLOTS.A ? 'bg-slate-200 text-slate-400 line-through' : 'role-A'}`}>A: {stats.roleCounts.A}/6</div>
                                            </div>
                                        </div>
                                    );
                                })}
                                </div>
                            </div>
                            
                            {/* Sezione Cronologia Acquisti */}
                            <div className="h-1/3 min-h-[200px] border-t border-slate-200 bg-white flex flex-col">
                                <div className="p-3 border-b border-slate-100 bg-slate-50 shrink-0">
                                    <h3 className="text-sm font-bold text-slate-600 uppercase flex items-center gap-2">
                                        <i className="fa-solid fa-clock-rotate-left"></i> Ultime Operazioni
                                    </h3>
                                </div>
                                <div className="flex-1 overflow-y-auto p-2">
                                    {purchases.length === 0 ? (
                                        <div className="text-center text-slate-400 text-sm mt-4 italic">Nessun acquisto registrato</div>
                                    ) : (
                                        <ul className="space-y-1">
                                            {purchases.slice(0, 15).map(pur => (
                                                <li key={pur.id} className="text-sm p-2 hover:bg-slate-50 rounded flex justify-between items-center border-b border-slate-50 last:border-0">
                                                    <div className="flex items-center gap-2 truncate">
                                                        <span className={`inline-block w-5 text-center text-[10px] font-bold rounded role-${pur.player.ruolo}`}>{pur.player.ruolo}</span>
                                                        <span className="font-semibold text-slate-700 truncate">{pur.player.nome}</span>
                                                        <span className="text-xs text-slate-400 ml-1">({pur.teamName})</span>
                                                    </div>
                                                    <span className="font-black text-blue-600 shrink-0">{pur.price} cr</span>
                                                </li>
                                            ))}
                                        </ul>
                                    )}
                                </div>
                            </div>
                        </div>

                        {/* Colonna Destra (Ricerca e Chiamata) */}
                        <div className="w-1/2 flex flex-col bg-white overflow-hidden shadow-[0_0_15px_rgba(0,0,0,0.05)] z-10 relative">
                            <div className="p-6 border-b border-slate-100 shrink-0 bg-slate-50">
                                <h2 className="text-lg font-bold text-slate-700 mb-4 uppercase">Ricerca / Chiamata</h2>
                                <div className="relative">
                                    <i className="fa-solid fa-magnifying-glass absolute left-3 top-3.5 text-slate-400"></i>
                                    <input 
                                        type="text" 
                                        className="w-full pl-10 pr-4 py-3 bg-white border border-slate-200 rounded-lg shadow-sm focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition"
                                        placeholder="Cerca giocatore nel listone..."
                                        value={search}
                                        onChange={e => setSearch(e.target.value)}
                                    />
                                </div>
                                {search.length > 1 && !selectedPlayer && (
                                    <div className="absolute left-6 right-6 mt-1 bg-white border border-slate-200 rounded-lg shadow-xl max-h-60 overflow-y-auto z-50">
                                        {filteredPlayers.map(p => (
                                            <div 
                                                key={p.id} 
                                                className="p-3 hover:bg-slate-50 cursor-pointer border-b last:border-0 flex justify-between items-center"
                                                onClick={() => { setSelectedPlayer(p); setSearch(''); }}
                                            >
                                                <div className="flex-1">
                                                    <span className={`inline-block w-6 text-center text-xs font-bold mr-2 rounded role-${p.ruolo}`}>{p.ruolo}</span>
                                                    <span className="font-semibold">{p.nome}</span>
                                                    <span className="text-xs text-slate-500 ml-2">({p.squadra})</span>
                                                </div>
                                                <div className="text-xs text-slate-600 font-medium flex gap-3 text-right">
                                                    <span>QI: <strong className="text-slate-800">{p.qi !== undefined ? p.qi : '-'}</strong></span>
                                                    <span>QA: <strong className="text-slate-800">{p.qa !== undefined ? p.qa : '-'}</strong></span>
                                                    <span className="text-blue-600 ml-1">FVM: <strong className="text-blue-700">{p.fvm}</strong></span>
                                                </div>
                                            </div>
                                        ))}
                                        {filteredPlayers.length === 0 && (
                                            <div className="p-4 text-center text-slate-500 text-sm">Nessun giocatore disponibile con questo nome.</div>
                                        )}
                                    </div>
                                )}
                            </div>

                            <div className="flex-1 p-6 overflow-y-auto">
                                {selectedPlayer ? (
                                    <div className="h-full flex flex-col max-w-2xl mx-auto">
                                        <div className="text-center mb-8">
                                            <span className={`inline-block px-4 py-1.5 rounded-full text-sm font-bold mb-4 role-${selectedPlayer.ruolo}`}>
                                                Ruolo {selectedPlayer.ruolo}
                                            </span>
                                            <h3 className="text-4xl font-black text-slate-800 mb-2">{selectedPlayer.nome}</h3>
                                            <p className="text-slate-500 text-xl uppercase tracking-wide">{selectedPlayer.squadra}</p>
                                        </div>

                                        <div className="flex justify-center items-center gap-6 mb-8 w-full px-4">
                                            <div className="bg-slate-50 py-4 px-2 rounded-2xl text-center border border-slate-200 shadow-sm flex-1">
                                                <p className="text-sm text-slate-500 uppercase font-bold mb-1">QI</p>
                                                <p className="text-3xl font-black text-slate-700">{selectedPlayer.qi !== undefined ? selectedPlayer.qi : '-'}</p>
                                            </div>
                                            
                                            <div className="bg-blue-50 py-5 px-4 rounded-2xl text-center border border-blue-200 shadow-sm flex-[1.5]">
                                                <p className="text-sm text-blue-600 uppercase font-bold mb-1">FVM</p>
                                                <p className="text-5xl font-black text-blue-800">{selectedPlayer.fvm} <span className="text-3xl font-medium ml-1">cr</span></p>
                                            </div>

                                            <div className="bg-slate-50 py-4 px-2 rounded-2xl text-center border border-slate-200 shadow-sm flex-1">
                                                <p className="text-sm text-slate-500 uppercase font-bold mb-1">QA</p>
                                                <p className="text-3xl font-black text-slate-700">{selectedPlayer.qa !== undefined ? selectedPlayer.qa : '-'}</p>
                                            </div>
                                        </div>

                                        <div className="mt-auto bg-slate-900 p-6 rounded-2xl text-white shadow-xl flex flex-col gap-5">
                                            <h4 className="font-bold border-b border-slate-700 pb-3 uppercase text-sm tracking-wider text-slate-300">Assegnazione Acquisto</h4>
                                            
                                            <div className="flex gap-4">
                                                <select 
                                                    className="flex-1 p-4 bg-slate-800 border border-slate-600 rounded-lg text-white outline-none focus:border-blue-500 text-lg"
                                                    value={bidTeam}
                                                    onChange={(e) => setBidTeam(e.target.value)}
                                                >
                                                    {teams.map((t, idx) => (
                                                        <option key={t.id || idx} value={idx}>{t.name} (Budget: {getTeamStats(t).remainingBudget} | Max Bid: {getTeamStats(t).maxBid})</option>
                                                    ))}
                                                </select>
                                                
                                                {/* L'input type text è stato preservato come richiesto, implementando la validazione lato js */}
                                                <input 
                                                    ref={bidInputRef}
                                                    type="text" 
                                                    className="w-24 p-4 bg-slate-800 border border-slate-600 rounded-lg text-white text-center text-2xl font-bold outline-none focus:border-blue-500"
                                                    placeholder="CR"
                                                    value={bidPrice}
                                                    onChange={(e) => setBidPrice(e.target.value)}
                                                    onKeyDown={(e) => e.key === 'Enter' && handlePurchase()}
                                                />
                                            </div>
                                            
                                            <div className="flex gap-4 mt-2">
                                                <button onClick={markUnsold} className="w-1/3 bg-slate-700 hover:bg-slate-600 font-bold rounded-lg shadow transition text-sm uppercase">Invenduto</button>
                                                <button onClick={handlePurchase} className="flex-1 bg-blue-600 hover:bg-blue-500 py-4 font-bold rounded-lg shadow transition text-xl uppercase tracking-wide flex items-center justify-center gap-3">
                                                    <i className="fa-solid fa-gavel"></i> Aggiudica
                                                </button>
                                            </div>
                                        </div>
                                    </div>
                                ) : (
                                    <div className="h-full flex flex-col items-center justify-center text-slate-400">
                                        <i className="fa-solid fa-magnifying-glass text-8xl mb-6 opacity-10"></i>
                                        <p className="font-medium text-xl">Nessuna chiamata in corso.</p>
                                        <p className="text-sm mt-2 opacity-60">Cerca un giocatore per procedere all'assegnazione.</p>
                                    </div>
                                )}
                            </div>
                        </div>
                    </div>

                    {/* Modale Visualizzazione Rosa */}
                    {viewingTeam && (
                        <div className="fixed inset-0 bg-black/60 z-[100] flex items-center justify-center p-4 backdrop-blur-sm" onClick={() => setViewingTeam(null)}>
                            <div className="bg-white rounded-xl shadow-2xl w-full max-w-2xl flex flex-col max-h-[90vh]" onClick={e => e.stopPropagation()}>
                                <div className="p-4 bg-slate-900 text-white rounded-t-xl flex justify-between items-center">
                                    <h2 className="text-xl font-bold">Rosa: {viewingTeam.name}</h2>
                                    <button onClick={() => setViewingTeam(null)} className="text-slate-400 hover:text-white transition">
                                        <i className="fa-solid fa-xmark text-2xl"></i>
                                    </button>
                                </div>
                                <div className="p-4 overflow-y-auto">
                                    {['P', 'D', 'C', 'A'].map(ruolo => {
                                        const giocatoriRuolo = viewingTeam.players.filter(p => p.ruolo === ruolo);
                                        if (giocatoriRuolo.length === 0) return null;
                                        return (
                                            <div key={ruolo} className="mb-4 last:mb-0">
                                                <h3 className={`font-bold border-b mb-2 pb-1 role-${ruolo} bg-transparent text-slate-800 border-slate-200`}>
                                                    {ruolo === 'P' ? 'Portieri' : ruolo === 'D' ? 'Difensori' : ruolo === 'C' ? 'Centrocampisti' : 'Attaccanti'} 
                                                    <span className="text-sm font-normal text-slate-500 ml-2">({giocatoriRuolo.length}/{MAX_SLOTS[ruolo]})</span>
                                                </h3>
                                                <ul className="grid grid-cols-2 gap-2">
                                                    {giocatoriRuolo.map(g => {
                                                        // Cerca il prezzo di acquisto nella cronologia
                                                        const acquisto = purchases.find(pur => pur.player.id === g.id && pur.teamName === viewingTeam.name);
                                                        return (
                                                            <li key={g.id} className="bg-slate-50 p-2 rounded flex justify-between items-center text-sm border border-slate-100">
                                                                <span className="font-semibold text-slate-700">{g.nome}</span>
                                                                <span className="font-black text-blue-600">{acquisto ? acquisto.price : '?'} cr</span>
                                                            </li>
                                                        );
                                                    })}
                                                </ul>
                                            </div>
                                        );
                                    })}
                                    {viewingTeam.players.length === 0 && (
                                        <p className="text-center text-slate-500 italic py-8">Nessun giocatore acquistato.</p>
                                    )}
                                </div>
                            </div>
                        </div>
                    )}

                    {/* Toast Notification Container */}
                    {toast && (
                        <div className={`fixed bottom-6 right-6 px-6 py-4 rounded-lg shadow-2xl z-[200] flex items-center gap-3 text-white toast-enter ${toast.type === 'error' ? 'bg-red-600' : 'bg-green-600'}`}>
                            <i className={`fa-solid ${toast.type === 'error' ? 'fa-circle-exclamation' : 'fa-circle-check'} text-xl`}></i>
                            <p className="font-medium">{toast.message}</p>
                        </div>
                    )}
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
