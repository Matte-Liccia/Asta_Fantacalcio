                let maxPlayers = 0;
                teams.forEach(t => {
                    if (t.players.length > maxPlayers) maxPlayers = t.players.length;
                });
                
                const totalRows = maxPlayers + 2;
                for (let i = 0; i < totalRows; i++) {
                    excelData.push([]);
                }

                teams.forEach((team, teamIndex) => {
                    const colOffset = teamIndex * 4;

                    // Riga 0: Nome squadra
                    excelData[0][colOffset] = `${team.name}`;
                    merges.push({ s: { r: 0, c: colOffset }, e: { r: 0, c: colOffset + 2 } });

                    // Riga 1: Intestazioni
                    excelData[1][colOffset] = "Ruolo";
                    excelData[1][colOffset + 1] = "Nome Giocatore";
                    excelData[1][colOffset + 2] = "Prezzo";

                    // Larghezze colonne
                    colsWidth[colOffset] = { wch: 8 };
                    colsWidth[colOffset + 1] = { wch: 25 };
                    colsWidth[colOffset + 2] = { wch: 10 };
                    colsWidth[colOffset + 3] = { wch: 3 };

                    const sorted = [...team.players].sort((a, b) => {
                        const order = {'P': 1, 'D': 2, 'C': 3, 'A': 4};
                        if (order[a.ruolo] !== order[b.ruolo]) return order[a.ruolo] - order[b.ruolo];
                        return a.nome.localeCompare(b.nome);
                    });

                    sorted.forEach((p, pIndex) => {
                        const purchase = purchases.find(pur => pur.player.id === p.id && pur.teamIdx === teamIndex);
                        excelData[pIndex + 2][colOffset] = p.ruolo;
                        excelData[pIndex + 2][colOffset + 1] = p.nome;
                        excelData[pIndex + 2][colOffset + 2] = purchase ? purchase.price : 0;
                    });
                });

                const ws = XLSX.utils.aoa_to_sheet(excelData);
                
                // --- APPLICHIAMO GLI STILI A TUTTE LE CELLE ---
                for (const cellAddress in ws) {
                    if (cellAddress[0] === '!') continue; // Salta le impostazioni di sistema di Excel
                    
                    // Decodifica l'indirizzo della cella per capire su che riga ci troviamo (0-based)
                    const cellRow = XLSX.utils.decode_cell(cellAddress).r;
                    
                    ws[cellAddress].s = {
                        alignment: {
                            horizontal: "center",
                            vertical: "center"
                        },
                        // Se è la riga 0 (Nome squadra) o riga 1 (Intestazioni), metti il testo in grassetto
                        font: {
                            bold: cellRow <= 1
                        }
                    };
                }

                ws['!merges'] = merges;
                ws['!cols'] = colsWidth;

                const wb = XLSX.utils.book_new();
                XLSX.utils.book_append_sheet(wb, ws, "Asta Fantacalcio");

                const fileName = `Riepilogo-Asta-${new Date().toISOString().slice(0, 10)}.xlsx`;
                XLSX.writeFile(wb, fileName);
            };

            return (
                <div className="h-screen flex flex-col font-sans overflow-hidden">
                    <header className="bg-slate-900 text-white p-4 flex justify-between items-center shrink-0 shadow-md">
                        <div className="flex items-center gap-3">
                            <i className="fa-solid fa-clipboard-user text-2xl text-blue-400"></i>
                            <h1 className="text-xl font-bold uppercase tracking-wider">SanPa_Calcio <br/> Asta Live</h1>
                        </div>
                        <div className="flex gap-4">
                            <button onClick={undoLast} className="px-4 py-2 bg-yellow-600 hover:bg-yellow-700 text-sm font-semibold rounded shadow transition">
                                <i className="fa-solid fa-rotate-left mr-2"></i> Annulla Ultimo Acquisto
                            </button>
                            <button onClick={resetAll} className="px-4 py-2 bg-red-600 hover:bg-red-700 text-sm font-semibold rounded shadow transition">
                                <i className="fa-solid fa-trash mr-2"></i> Reset Totale
                            </button>
                            <button onClick={generateExport} className="px-4 py-2 bg-green-600 hover:bg-green-700 text-sm font-semibold rounded shadow transition">
                                <i className="fa-solid fa-file-excel mr-2"></i> Esporta per Leghe (Excel)
                            </button>
                        </div>
                    </header>

                    <div className="flex-1 flex overflow-hidden">
                        {/* Sinistra: Avversari (Allargato) */}
                        <div className="w-1/2 bg-slate-50 border-r border-slate-200 overflow-y-auto p-4 space-y-4">
                           <div className="flex justify-between items-center border-b pb-2 mb-4">
                                <h2 className="text-lg font-bold text-slate-700 uppercase">Situazione Squadre ({teams.length})</h2>
                                <button onClick={addTeam} className="bg-blue-600 hover:bg-blue-500 text-white px-3 py-1 rounded text-sm font-bold shadow transition">
                                    <i className="fa-solid fa-plus mr-1"></i> Aggiungi
                                </button>
                            </div>
                            <div className="grid grid-cols-2 gap-4">
                            {teams.map((team, idx) => {
                                const stats = getTeamStats(team);
                                return (
                                    <div key={idx} className="bg-white p-3 rounded-lg shadow-sm border border-slate-100 flex flex-col gap-2">
                                        <div className="flex justify-between items-center">
                                            <span className="font-bold text-slate-800 flex items-center gap-2">
                                                {team.name}
                                                <button onClick={() => editTeamName(idx)} className="text-slate-400 hover:text-blue-600 transition" title="Modifica Nome Squadra">
                                                    <i className="fa-solid fa-pen text-[10px]"></i>
                                                </button>
                                                <button onClick={() => removeTeam(idx)} className="text-slate-400 hover:text-red-600 transition" title="Rimuovi Squadra">
                                                    <i className="fa-solid fa-trash text-[10px]"></i>
                                                </button>
                                            </span>
                                            <span className="text-xl font-black text-green-600">{stats.remainingBudget} <span className="text-xs text-slate-400 font-normal">CR</span></span>
                                        </div>
                                        <div className="flex justify-between text-xs text-slate-500 font-medium">
                                            <span>MAX Rilancio: <strong className="text-slate-800">{stats.maxBid}</strong></span>
                                            <span>Slot Liberi: <strong>{stats.emptySlots}/25</strong></span>
                                        </div>
                                        <div className="flex gap-1 text-[11px] mt-1">
                                            <div className={`px-2 py-0.5 rounded flex-1 text-center font-bold ${stats.roleCounts.P >= MAX_SLOTS.P ? 'bg-slate-200 opacity-50' : 'role-P'}`}>P: {stats.roleCounts.P}/3</div>
                                            <div className={`px-2 py-0.5 rounded flex-1 text-center font-bold ${stats.roleCounts.D >= MAX_SLOTS.D ? 'bg-slate-200 opacity-50' : 'role-D'}`}>D: {stats.roleCounts.D}/8</div>
                                            <div className={`px-2 py-0.5 rounded flex-1 text-center font-bold ${stats.roleCounts.C >= MAX_SLOTS.C ? 'bg-slate-200 opacity-50' : 'role-C'}`}>C: {stats.roleCounts.C}/8</div>
                                            <div className={`px-2 py-0.5 rounded flex-1 text-center font-bold ${stats.roleCounts.A >= MAX_SLOTS.A ? 'bg-slate-200 opacity-50' : 'role-A'}`}>A: {stats.roleCounts.A}/6</div>
                                        </div>
                                    </div>
                                );
                            })}
                            </div>
                        </div>

                        {/* Destra: Cockpit e Chiamate (Allargato) */}
                        <div className="w-1/2 flex flex-col bg-white overflow-hidden shadow-[0_0_15px_rgba(0,0,0,0.05)] z-10 relative">
                            <div className="p-6 border-b border-slate-100 shrink-0 bg-slate-50">
                                <h2 className="text-lg font-bold text-slate-700 mb-4 uppercase">Chiamata / Ricerca Giocatore</h2>
                                <div className="relative">
                                    <i className="fa-solid fa-magnifying-glass absolute left-3 top-3.5 text-slate-400"></i>
                                    <input 
                                        type="text" 
                                        className="w-full pl-10 pr-4 py-3 bg-white border border-slate-200 rounded-lg shadow-sm focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition"
                                        placeholder="Cerca giocatore nel listone..."
                                        value={search}
                                        onChange={e => setSearch(e.target.value)}
                                    />
                                </div>
                                {search.length > 1 && !selectedPlayer && (
                                    <div className="absolute left-6 right-6 mt-1 bg-white border border-slate-200 rounded-lg shadow-xl max-h-60 overflow-y-auto z-50">
                                        {getFilteredPlayers().map(p => (
                                            <div 
                                                key={p.id} 
                                                className="p-3 hover:bg-slate-50 cursor-pointer border-b last:border-0 flex justify-between items-center"
                                                onClick={() => { setSelectedPlayer(p); setSearch(''); }}
                                            >
                                                <div>
                                                    <span className={`inline-block w-6 text-center text-xs font-bold mr-2 rounded role-${p.ruolo}`}>{p.ruolo}</span>
                                                    <span className="font-semibold">{p.nome}</span>
                                                </div>
                                                <span className="text-xs text-slate-500">{p.squadra}</span>
                                            </div>
                                        ))}
                                        {getFilteredPlayers().length === 0 && (
                                            <div className="p-4 text-center text-slate-500 text-sm">Nessun giocatore trovato o già acquistato.</div>
                                        )}
                                    </div>
                                )}
                            </div>

                            <div className="flex-1 p-6 overflow-y-auto">
                                {selectedPlayer ? (
                                    <div className="h-full flex flex-col max-w-2xl mx-auto">
                                        <div className="text-center mb-8">
                                            <span className={`inline-block px-4 py-1.5 rounded-full text-sm font-bold mb-4 role-${selectedPlayer.ruolo}`}>
                                                Ruolo {selectedPlayer.ruolo}
                                            </span>
                                            <h3 className="text-4xl font-black text-slate-800 mb-2">{selectedPlayer.nome}</h3>
                                            <p className="text-slate-500 text-xl uppercase tracking-wide">{selectedPlayer.squadra}</p>
                                        </div>

                                        <div className="flex justify-center mb-8">
                                            <div className="bg-slate-50 p-6 rounded-2xl text-center border border-slate-200 shadow-sm w-1/2">
                                                <p className="text-sm text-slate-500 uppercase font-bold mb-2">FVM (Fantavalore Mercato)</p>
                                                <p className="text-4xl font-black text-slate-700">{selectedPlayer.fvm} <span className="text-lg font-normal">cr</span></p>
                                            </div>
                                        </div>

                                        <div className="mt-auto bg-slate-900 p-6 rounded-2xl text-white shadow-xl flex flex-col gap-5">
                                            <h4 className="font-bold border-b border-slate-700 pb-3 uppercase text-sm tracking-wider text-slate-300">Assegnazione Acquisto</h4>
                                            
                                            <div className="flex gap-4">
                                                <select 
                                                    className="flex-1 p-4 bg-slate-800 border border-slate-600 rounded-lg text-white outline-none focus:border-blue-500 text-lg"
                                                    value={bidTeam}
                                                    onChange={(e) => setBidTeam(e.target.value)}
                                                >
                                                    {teams.map((t, idx) => (
                                                        <option key={idx} value={idx}>{t.name} (Budget: {getTeamStats(t).remainingBudget} cr | Max Bid: {getTeamStats(t).maxBid} cr)</option>
                                                    ))}
                                                </select>
                                                <input 
                                                    type="number" 
                                                    className="w-32 p-4 bg-slate-800 border border-slate-600 rounded-lg text-white text-center text-2xl font-bold outline-none focus:border-blue-500"
                                                    placeholder="CR"
                                                    value={bidPrice}
                                                    onChange={(e) => setBidPrice(e.target.value)}
                                                />
                                            </div>
                                            
                                            <div className="flex gap-4 mt-2">
                                                <button onClick={markUnsold} className="w-1/3 bg-slate-700 hover:bg-slate-600 font-bold rounded-lg shadow transition text-sm uppercase">Invenduto (Scarta)</button>
                                                <button onClick={handlePurchase} className="flex-1 bg-blue-600 hover:bg-blue-500 py-4 font-bold rounded-lg shadow transition text-xl uppercase tracking-wide flex items-center justify-center gap-3">
                                                    <i className="fa-solid fa-gavel"></i> Aggiudica
                                                </button>
                                            </div>
                                        </div>
                                    </div>
                                ) : (
                                    <div className="h-full flex flex-col items-center justify-center text-slate-400">
                                        <i className="fa-solid fa-magnifying-glass text-8xl mb-6 opacity-10"></i>
                                        <p className="font-medium text-xl">Nessuna chiamata in corso.</p>
                                        <p className="text-sm mt-2 opacity-60">Cerca un giocatore nel listone per assegnarlo.</p>
                                    </div>
                                )}
                            </div>
                        </div>
                    </div>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
